# Root orchestrator. Brings up everything in both `backend/` and
# `frontend/` with one command. Each side still works standalone (cd
# into the folder, `docker compose up`) — this file just composes both.
#
# The volumes + networks inside the included files are NAMED so the
# same Docker resources get reused whether you run from the root or
# from inside one of the sub-folders.

include:
  - backend/docker-compose.yml
  - frontend/docker-compose.yml
