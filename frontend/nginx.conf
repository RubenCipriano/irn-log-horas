# nginx config running INSIDE the frontend container. Serves the
# Next.js static export from /usr/share/nginx/html.
#
# Routing strategy:
#   - Static marketing pages (/, /about, /policy, /login, /signup) resolve
#     to their `<route>.html` files via the trailing-html try_files step.
#   - Unknown URLs (e.g. /dashboard, /orgs/foo/dashboard) fall through to
#     /__shell__.html — the catch-all SPA shell built by `app/(app)/[...path]`.
#     That shell reads window.location.pathname and dispatches client-side.
#   - /_next/static/* is the hashed asset folder Next emits; long
#     immutable cache.

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long immutable cache for Next-hashed assets (per-build hashes).
    location /_next/static/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Generic /assets/ folder if anything ends up there (logos, fonts).
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Top-level routes: try the path as-is, then `<path>.html`, then fall
    # back to the SPA shell. This catches both /about (→ /about.html, real
    # static page) and /dashboard (→ no file, fall through to shell).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /__shell__.html;
    }
}
